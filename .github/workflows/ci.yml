name: CI

on:
  push:
  pull_request:

jobs:
  native:
    # macos-14 ships Swift 5.10, which rejects concurrency captures the app's
    # Swift 6 toolchain accepts; macos-15 is closer to what the app is built with.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@nextest
      - uses: astral-sh/setup-uv@v6
      - name: Python runtime locks match their requirements
        run: |
          uv lock --check --project runtime/asr
          uv lock --check --project runtime/polish
      - run: cargo fmt --all -- --check
      - run: cargo nextest run --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: PYTHONPATH=. uv run --with pytest --with numpy pytest
      - run: uv run --with ruff ruff check sidecar tests scripts
      - run: swift test --package-path bar

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
