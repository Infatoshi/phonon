name: Windows

on:
  push:
    branches: [windows-beta, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep the cache off C:\Users so the runner's larger disk holds the weights.
  PHONON_WIN_HOME: D:\phonon

jobs:
  build:
    name: build and unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-beta

      - name: format
        run: cargo fmt --all -- --check

      - name: unit tests
        run: cargo test -p phonon-win -p phonon-hotkey

      - name: clippy
        run: cargo clippy -p phonon-win -p phonon-hotkey --all-targets -- -D warnings

      - name: build the release executable
        run: cargo build --release -p phonon-win

      - name: describe the download manifest
        run: target\release\phonon-win.exe info

      - uses: actions/upload-artifact@v4
        with:
          name: phonon-win
          path: target/release/phonon-win.exe
          if-no-files-found: error
          retention-days: 30

      # The installer a stranger double-clicks: per-user install, Start menu and sign-in shortcuts, and the
      # Visual C++ runtime when the machine lacks it. packaging/windows/phonon.nsi says what it does.
      - name: build the installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile vc_redist.x64.exe
          $version = (Select-String -Path Cargo.toml -Pattern '^version' | Select-Object -First 1).Line.Split('"')[1]
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -V2 "-DVERSION=$version" `
            "-DEXE=$PWD\target\release\phonon-win.exe" "-DVCREDIST=$PWD\vc_redist.x64.exe" `
            "-DOUT=$PWD\target\release\Phonon-Setup-$version.exe" packaging\windows\phonon.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: phonon-win-installer
          path: target/release/Phonon-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: end-to-end on real Windows
    needs: build
    runs-on: windows-latest
    # Downloading four gigabytes of weights and running them on a shared CPU is
    # slow. This is the release gate, so give it room.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phonon-win
          path: bin

      - name: prepare the model cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:PHONON_WIN_HOME | Out-Null
          Write-Host "cache root: $env:PHONON_WIN_HOME"

      # The runtimes are small and change only when the pinned tags change.
      # The weights are 1.6 GB and are fetched fresh; caching them would
      # push the repository over its cache budget.
      - name: cache the runtimes
        uses: actions/cache@v4
        with:
          path: D:\phonon\runtime
          key: phonon-win-runtime-sherpa1.13.6-llama-b12132-vulkan

      - name: download and verify the runtimes and weights
        run: bin\phonon-win.exe fetch

      # The gate. Real Parakeet, the real refiner, real audio, on real Windows.
      # It fails when the transcript is wrong, when correction collapses the
      # sentence, or when correction runs away.
      - name: end-to-end selftest on the startup fixture
        run: bin\phonon-win.exe selftest --wav assets\startup.wav

      - name: report what is installed
        if: always()
        run: bin\phonon-win.exe info

  linux:
    name: Linux build, unit tests, and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Override the Windows job default; keep weights out of the checkout.
      PHONON_WIN_HOME: /tmp/phonon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-beta

      - name: install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libgomp1 tar gzip bzip2

      - name: format
        run: cargo fmt --all -- --check

      - name: unit tests
        run: nice -n 10 cargo test -p phonon-win -p phonon-hotkey --locked

      - name: clippy
        run: nice -n 10 cargo clippy -p phonon-win -p phonon-hotkey --all-targets --locked -- -D warnings

      - name: build the release executable
        run: nice -n 10 cargo build --release -p phonon-win --locked

      - name: build the .deb
        run: scripts/package-deb.sh target/release/phonon-win

      - uses: actions/upload-artifact@v4
        with:
          name: phonon-linux-x64
          path: |
            target/release/phonon-win
            target/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: cache the runtimes
        uses: actions/cache@v4
        with:
          path: ${{ env.PHONON_WIN_HOME }}/runtime
          key: phonon-linux-x64-runtime-sherpa1.13.6-llama-b12132

      - name: download and verify the runtimes and weights
        run: nice -n 10 target/release/phonon-win fetch

      - name: end-to-end selftest on the startup fixture
        run: nice -n 10 target/release/phonon-win selftest --wav assets/startup.wav

      - name: report what is installed
        if: always()
        run: target/release/phonon-win info

      - name: preserve correction diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phonon-linux-logs
          path: ${{ env.PHONON_WIN_HOME }}/logs
          if-no-files-found: ignore
