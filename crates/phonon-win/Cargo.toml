[package]
name = "phonon-win"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Phonon for Windows: tray app, global hotkey, local ASR and correction."

[[bin]]
name = "phonon-win"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
hound = "3"
phonon-hotkey = { path = "../phonon-hotkey" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# native-tls uses SChannel on Windows and Security.framework on macOS, so no
# C toolchain is needed to build or to cross-check this crate.
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["json", "gzip", "native-tls"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
