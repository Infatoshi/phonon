[package]
name = "phonon-win"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Phonon for Windows: tray app, global hotkey, local ASR and correction."

[[bin]]
name = "phonon-win"
path = "src/main.rs"

[package.metadata.winresource]
OriginalFilename = "phonon-win.exe"

[dependencies]
anyhow.workspace = true
# The 0.6 default is libbz2-rs-sys (pure Rust); do not enable bzip2-sys.
bzip2 = "0.6"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hound = "3"
libloading = "0.8"
# Backend manifest signatures (backends.rs). Pure Rust, no dependencies without its default features.
ed25519-compact = { version = "2", default-features = false, features = ["std"] }
phonon-hotkey = { path = "../phonon-hotkey" }
phonon-llm = { path = "../phonon-llm" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# native-tls uses SChannel on Windows and Security.framework on macOS, so no
# C toolchain is needed to build or to cross-check this crate.
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["json", "gzip", "native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"

[build-dependencies]
cc = "1"
# build.rs embeds the icon and version resource whenever the target is Windows, including cross builds (llvm-rc)
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
