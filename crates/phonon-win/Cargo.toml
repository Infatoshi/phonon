[package]
name = "phonon-win"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Phonon for Windows: tray app, global hotkey, local ASR and correction."

[[bin]]
name = "phonon-win"
path = "src/main.rs"

[package.metadata.winresource]
OriginalFilename = "phonon-win.exe"

[features]
# QA builds only: also accept backend manifests signed with the public RFC 8032 test key (backends.rs).
backend-test-key = []

[dependencies]
anyhow.workspace = true
# The 0.6 default is libbz2-rs-sys (pure Rust); do not enable bzip2-sys.
bzip2 = "0.6"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hound = "3"
# .tar.xz backend bundles (fetch.rs): pure Rust, about 15% smaller downloads than bzip2.
lzma-rs = "0.3"
libloading = "0.8"
# Backend manifest signatures (backends.rs). Pure Rust, no dependencies without its default features.
ed25519-compact = { version = "2", default-features = false, features = ["std"] }
phonon-hotkey = { path = "../phonon-hotkey" }
# The personal dictionary's file format and matching (dictionary.rs), shared with the Mac.
phonon-core = { path = "../phonon-core" }
phonon-llm = { path = "../phonon-llm" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# native-tls uses SChannel on Windows and Security.framework on macOS, so no
# C toolchain is needed to build or to cross-check this crate.
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["json", "gzip", "native-tls"] }

# The settings window (src/window.rs), a separate `settings` process; the resident app never calls it.
# Linux: OpenGL through glow; winit and glutin open libEGL/libGL, libxkbcommon, libwayland-client and
# the X11 libraries at run time (dlopen), so the binary links nothing new.
[target.'cfg(target_os = "linux")'.dependencies.eframe]
version = "0.37"
default-features = false
# no "clipboard": its Wayland half adds a megabyte; Copy uses arboard, which the app already links
features = ["glow", "default_fonts", "x11", "wayland"]

# Windows: Direct3D 12 through wgpu. A Windows without a GPU driver (a VM, a basic display adapter) has
# only OpenGL 1.1, which glow cannot use; Direct3D 12 falls back to the WARP software rasterizer.
# Only the Direct3D 12 backend and the WGSL front end are built (wgpu's defaults add Vulkan and GLES).
[target.'cfg(windows)'.dependencies.eframe]
version = "0.37"
default-features = false
features = ["wgpu_no_default_features", "default_fonts", "clipboard"]

[target.'cfg(windows)'.dependencies.wgpu]
version = "30"
default-features = false
features = ["std", "dx12", "wgsl"]

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
# Already used by winit; query the pointer's monitor without linking X11.
x11-dl = "2.21"

[build-dependencies]
cc = "1"
# build.rs embeds the icon and version resource whenever the target is Windows, including cross builds (llvm-rc)
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
