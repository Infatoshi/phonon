name: Phonon
options:
  bundleIdPrefix: com.abhaymettu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  FluidAudio:
    path: Vendor/FluidAudio
  PhononCore:
    path: PhononCore
targets:
  Phonon:
    type: application
    platform: iOS
    sources:
      - path: Phonon
      - path: Fixtures
        type: folder
        buildPhase: resources
      - path: LICENSES.md
        buildPhase: resources
    dependencies:
      - target: PhononKeyboard
      - package: FluidAudio
        product: FluidAudio
      - package: PhononCore
      - framework: Vendor/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhaymettu.phonon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Phonon/Info.plist
      properties:
        CFBundleDisplayName: Phonon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Phonon listens only while you dictate. Speech is turned into text on this iPhone and never leaves it.
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.abhaymettu.phonon
            CFBundleURLSchemes: [phonon]
    entitlements:
      path: Phonon/Phonon.entitlements
      properties:
        com.apple.security.application-groups: [group.com.abhaymettu.phonon]
        com.apple.developer.kernel.increased-memory-limit: true
  PhononKeyboard:
    type: app-extension
    platform: iOS
    sources: [PhononKeyboard]
    dependencies:
      - package: PhononCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhaymettu.phonon.keyboard
    info:
      path: PhononKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Phonon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: PhononKeyboard/PhononKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.abhaymettu.phonon]
  PhononTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PhononTests]
    dependencies:
      - target: Phonon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhaymettu.phonon.tests
schemes:
  Phonon:
    build:
      targets:
        Phonon: all
        PhononTests: [test]
    test:
      targets: [PhononTests]
      environmentVariables:
        PHONON_MODELS_DIR: $(SRCROOT)/../../work/models
        PHONON_CHECKS_DIR: $(SRCROOT)/../../checks
