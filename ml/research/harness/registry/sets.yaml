# Eval sets phonon-bench is asked for. `frozen` is the sibling's fixture (copy with a sha256
# manifest under /data/phonon_bench_v0/sets/); `source` is the file it was frozen from and is
# what `phonon-research eval` falls back to while the fixture does not exist.
default: [real_580, term_old_seen, term_old_unseen, term_new]

sets:
  real_580:
    kind: real_audio
    reference: the user's kept text (date holdout)
    frozen: /data/phonon_bench_v0/sets/real_580.jsonl
    source: /data/phonon_corrector_v0/datesplit/holdout_date_audio.jsonl
  term_old_seen:
    kind: tts_terms
    reference: sentence text, 300 old held-out terms, voices seen in training
    frozen: /data/phonon_bench_v0/sets/term_old_seen.jsonl
    source: /data/phonon_term_eval_v0/asr.jsonl
  term_old_unseen:
    kind: tts_terms
    reference: sentence text, 300 old held-out terms, unseen voices
    frozen: /data/phonon_bench_v0/sets/term_old_unseen.jsonl
    source: /data/phonon_term_eval_v1/asr.jsonl
  term_new:
    kind: tts_terms
    reference: sentence text, 300 bigrun held-out terms
    frozen: /data/phonon_bench_v0/sets/term_new.jsonl
    source: /data/phonon_bigrun_v0/heldout_new_asr.jsonl
  term_pool2:
    kind: tts_terms
    reference: sentence text, pool2 held-out terms
    frozen: /data/phonon_bench_v0/sets/term_pool2.jsonl
    source: /data/phonon_pool2_v0/asr_heldout_half0.jsonl
  term_pool3:
    kind: tts_terms
    reference: sentence text, pool3 held-out terms (150 public repos, unseen voices)
    frozen: /data/phonon_bench_v0/sets/term_pool3.jsonl
    source: /data/phonon_pool3_v0/asr_heldout_s0.jsonl
  numerics_500:
    kind: numerics
    reference: teacher-forced, 500 rows sampled from real_580 + term_new
    frozen: /data/phonon_bench_v0/sets/numerics_500.jsonl
    source: built by phonon-bench from real_580 and term_new
