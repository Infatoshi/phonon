# The Python environment for the correction sidecar (sidecar/polish_server.py).
#
# uv.lock beside this file pins every package, transitive dependencies
# included, to an exact version and records the SHA-256 of each file. The app
# installs from it with `uv run --frozen`, which refuses any download whose
# hash does not match, so every install runs the same reviewed code. The lock
# ships inside the signed app bundle.
#
# To change a version: edit the requirement here (and the matching constant in
# the Rust crate), then run `uv lock --project runtime/polish` and commit both.
[project]
name = "phonon-polish-runtime"
version = "0"
requires-python = "==3.12.*"
dependencies = ["mlx-lm==0.31.3"]

[tool.uv]
# Not a package: uv installs the dependencies only.
package = false
# Phonon's sidecars run on Apple silicon Macs only.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Wheels only: never run a package's build scripts on a user's Mac.
no-build = true
